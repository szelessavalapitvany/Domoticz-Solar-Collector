	<script>
		if (typeof window.TranslationLoader === 'undefined') {

		class TranslationLoader {
			constructor() {
				this.translations = {};
				this.loadTranslations().then((translations) => {
					this.translations = translations;
					if ($.isEmptyObject(this.translations)) {
						console.log("Hiba történt a fordítások betöltése közben!");
					} else {
						this.translatePage();
					}
				});
			}

			async loadTranslations() {
				
				// Ellenőrzés, hogy a szükséges változók léteznek-e
				if (typeof proto === 'undefined' || typeof address === 'undefined' || typeof port === 'undefined') {
					console.error("Hiányzik a 'proto', 'address' vagy 'port' változó.");
					return {};
				}

				let aktlanguage;

				const settingsUrl = `${proto}${address}:${port.toString()}/json.htm?type=command&param=getsettings`;

				await fetch(settingsUrl)
					.then(response => {
						if (!response.ok) {
							throw new Error('Hálózati hiba történt');
						}
						return response.json();
					})
					.then(data => {
						if (data) {
							aktlanguage = data.Language;
						} else {
							console.error('Nem található nyelvi információ.');
						}
					})
					.catch(error => {
						console.error('Hiba a beállítások lekérése közben:', error);
					});

				console.log (aktlanguage)

				const filePath = `/templates/nkv_html_translate_${aktlanguage}.json`;
				try {
					const response = await $.getJSON(filePath);
					return response;
				} catch (error) {
					console.log(`Hiba történt a '${filePath}' fájl betöltése közben: ${error}`);
					return {};
				}
			}

			t(text) {
				return this.translations[text] || text;
			}
			translatePage() {
				$('[data-translate]').each((index, element) => {
					const key = $(element).data('translate');
					const translation = this.t(key);
					$(element).text(translation);
				});
				console.log("Oldal sikeresen leforditva.");
			}
		}

		window.TranslationLoader = TranslationLoader;
	}

	var script = document.createElement('script');
		script.src = 'templates/nkv_viewer.js?' + Date.now();
		document.head.appendChild(script);

	</script>

										mode4List.push(id);
									}
								});
							});

						//console.log(mode1List.join(','));

						var mode1QueryString = "Mode1=" + encodeURIComponent(mode1List.join(','));
						var mode2QueryString = "Mode2=" + encodeURIComponent(mode2List.join(','));
						var mode3QueryString = "Mode3=" + encodeURIComponent(mode3List.join(','));
						var mode4QueryString = "Mode4=" + encodeURIComponent(mode4List.join(','));
						var mode5QueryString = "Mode5=" + encodeURIComponent(document.getElementById('text_1_mode5_' + i).value);
						var mode6QueryString = "Mode6=" + encodeURIComponent(document.getElementById('text_1_mode6_' + i).value);

						var port = window.location.port ? ":" + window.location.port : "";

						var url = window.location.protocol + "//" + nkv[i].uname + ":" + nkv[i].pass + "@" + window.location.hostname + port + "/json.htm?type=command&param=updatehardware&htype=94&extra=NkV&idx=" + nkv[i].id + "&enabled=true&datatimeout=0&name=" + nkv[i].name + "&address=" + nkv[i].host + "&port=" + nkv[i].port + "&username=" + nkv[i].uname + "&password=" + nkv[i].pass + "&" + mode1QueryString + "&" + mode2QueryString + "&" + mode3QueryString + "&" + mode4QueryString + "&" + mode5QueryString + "&" + mode6QueryString;

						var completedRequests = 0;

						function sendRequest(url, data) {
							var xhr = new XMLHttpRequest();
							xhr.open("POST", url, true);
							xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");

							xhr.onreadystatechange = function () {
								if (xhr.readyState === 4) {
									if (xhr.status === 200) {
										//console.log(translationLoader.t("Data sent:") + xhr.responseText);
										completedRequests++;
										if (completedRequests === 1) {
											//alert(translationLoader.t("Data sent:") + nkv[i].name + "!");
											location.reload(); 
											hideSaveStatus();
										}
									} else {
										console.log(xhr.statusText);
										alert(translationLoader.t("It was a mistake") + nkv[i].name + translationLoader.t("when saving event data."));
									}
								}
							};
							xhr.send(JSON.stringify(data));
						}
						sendRequest(url, data);
					};
				})(i));
			}
		}
	});
	</script>
